<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leg Theory</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    /* HERO VIDEO */
    .hero-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }

    /* Slight dark overlay so the text stays readable */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.18);
      z-index: 2;
    }

    /* BRAND + BUTTON */
    .hero-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;

      width: 100%;
      text-align: center;
      color: white;
    }

    .hero-content h1 {
      font-size: clamp(42px, 8vw, 110px);
      font-weight: 300;
      letter-spacing: 0.18em;
      margin-bottom: 30px;
      white-space: nowrap;
    }

    .collection-button {
      display: inline-block;
      padding: 13px 25px;

      border: 1px solid white;
      color: white;
      background: transparent;

      text-decoration: none;
      text-transform: uppercase;

      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;

      transition: 0.25s ease;
    }

    .collection-button:hover {
      background: white;
      color: black;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .hero-content h1 {
        font-size: 11vw;
        letter-spacing: 0.12em;
        margin-bottom: 24px;
      }

      .collection-button {
        padding: 12px 22px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <video
      class="hero-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    >
      <source src="hero%20vid.mov" type="video/quicktime">
      Your browser does not support the video tag.
    </video>

    <div class="overlay"></div>

    <div class="hero-content">
      <h1>LEG THEORY</h1>

      <a class="collection-button" href="collection.html">
        View Collection
      </a>
    </div>

  </section>

</body>

</html>
