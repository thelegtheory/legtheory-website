<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leg Theory</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      display: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 24px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 96px);
      letter-spacing: 0.18em;
      font-weight: 500;
      margin-bottom: 32px;
    }

    .collection-button {
      display: inline-block;
      padding: 14px 26px;
      border: 1px solid #fff;
      color: #fff;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 13px;
      transition: 0.25s ease;
    }

    .collection-button:hover {
      background: #fff;
      color: #000;
    }
  </style>
</head>

<body>
  <section class="hero">

    <video class="hero-video" autoplay muted loop playsinline>
  <source src="hero%20vid.mov" type="video/quicktime">
</video>

    <div class="overlay"></div>

    <div class="hero-content">
      <h1>LEG THEORY</h1>

      <a class="collection-button" href="collection.html">
        View Collection
      </a>
    </div>

  </section>
</body>
</html>
