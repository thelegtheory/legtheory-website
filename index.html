<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leg Theory</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      color: #fff;
    }

    /* HERO */

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .hero-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }

    .hero-poster {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 2;
      transition: opacity 0.2s ease;
    }

    .hero-poster.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.18);
      z-index: 2;
    }

    /* TOP NAV */

    .top-nav {
      position: absolute;
      top: 28px;
      right: 32px;
      z-index: 5;

      display: flex;
      align-items: center;
      gap: 24px;
    }

    .top-nav a,
    .top-nav button {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.82);
      text-decoration: none;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      cursor: pointer;
      transition: color 0.2s ease;
    }

    .top-nav a:hover,
    .top-nav button:hover {
      color: #fff;
    }

    /* HERO CONTENT */

    .hero-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;

      width: 100%;
      text-align: center;
      color: white;
    }

    .hero-content h1 {
      font-size: clamp(42px, 8vw, 110px);
      font-weight: 300;
      letter-spacing: 0.18em;
      margin-bottom: 30px;
      white-space: nowrap;
    }

    .collection-button {
      display: inline-block;
      padding: 13px 25px;

      border: 1px solid white;
      color: white;
      background: transparent;

      text-decoration: none;
      text-transform: uppercase;

      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;

      transition: 0.25s ease;
    }

    .collection-button:hover {
      background: white;
      color: black;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: absolute;
      left: 30px;
      right: 30px;
      bottom: 26px;
      z-index: 5;

      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      pointer-events: none;
    }

    .bottom-group {
      position: relative;
      pointer-events: auto;
    }

    .bottom-toggle {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.72);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      cursor: pointer;
      padding: 8px 0;
      transition: color 0.2s ease;
    }

    .bottom-toggle:hover {
      color: #fff;
    }

    .bottom-menu {
      position: absolute;
      bottom: 36px;

      min-width: 210px;
      padding: 18px 20px;

      background: rgba(0, 0, 0, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.16);

      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);

      transition:
        opacity 0.2s ease,
        visibility 0.2s ease,
        transform 0.2s ease;
    }

    .bottom-menu.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .bottom-group.help .bottom-menu {
      left: 0;
    }

    .bottom-group.info .bottom-menu {
      right: 0;
      text-align: right;
    }

    .bottom-menu a {
      display: block;

      padding: 8px 0;

      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;

      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;

      transition: color 0.2s ease;
    }

    .bottom-menu a:hover {
      color: #fff;
    }

    /* COLLECTION DRAWER */

    .collection-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;

      z-index: 998;
    }

    .collection-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .collection-drawer {
      position: fixed;
      top: 0;
      left: 0;

      width: min(420px, 88vw);
      height: 100vh;

      background: #000;
      border-right: 1px solid rgba(255, 255, 255, 0.15);

      transform: translateX(-100%);
      transition: transform 0.4s ease;

      z-index: 999;

      padding: 44px 36px;
    }

    .collection-drawer.open {
      transform: translateX(0);
    }

    .drawer-close {
      position: absolute;
      top: 22px;
      right: 24px;

      background: none;
      border: none;
      color: #fff;

      font-size: 28px;
      font-weight: 200;

      cursor: pointer;
    }

    .drawer-content {
      margin-top: 70px;
    }

    .drawer-label {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: #fff;
      margin-bottom: 34px;
    }

    .drawer-product-title {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.12em;
      line-height: 1.4;
      color: #fff;
      margin-bottom: 18px;
    }

    .drawer-link {
      display: block;

      padding: 9px 0 9px 22px;

      color: rgba(255, 255, 255, 0.62);
      text-decoration: none;

      font-size: 14px;
      letter-spacing: 0.12em;

      transition: color 0.2s ease;
    }

    .drawer-link:hover {
      color: #fff;
    }

    .drawer-coming-soon {
      margin-top: 34px;

      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.12em;
      line-height: 1.4;

      color: rgba(255, 255, 255, 0.52);
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .top-nav {
        top: 22px;
        right: 22px;
        gap: 18px;
      }

      .hero-content h1 {
        font-size: 11vw;
        letter-spacing: 0.12em;
        margin-bottom: 24px;
      }

      .collection-button {
        padding: 12px 22px;
        font-size: 11px;
      }

      .bottom-nav {
        left: 22px;
        right: 22px;
        bottom: 20px;
      }

      .bottom-menu {
        min-width: 190px;
      }

      .collection-drawer {
        width: 88vw;
        padding: 34px 28px;
      }

      .drawer-content {
        margin-top: 58px;
      }
    }

  </style>
</head>

<body>

  <!-- COLLECTION DRAWER OVERLAY -->

  <div
    class="collection-overlay"
    id="collectionOverlay"
    onclick="closeCollectionDrawer()"
  ></div>


  <!-- COLLECTION DRAWER -->

  <aside
    class="collection-drawer"
    id="collectionDrawer"
  >

    <button
      class="drawer-close"
      type="button"
      onclick="closeCollectionDrawer()"
      aria-label="Close collection"
    >
      ×
    </button>

    <div class="drawer-content">

      <div class="drawer-label">
        COLLECTION
      </div>

      <div class="drawer-product-title">
        PATENT LEATHER LEG SLEEVES
      </div>

      <a
        class="drawer-link"
        href="collection.html?color=Black"
      >
        BLACK
      </a>

      <a
        class="drawer-link"
        href="collection.html?color=White"
      >
        WHITE
      </a>

      <a
        class="drawer-link"
        href="collection.html?color=Red"
      >
        RED
      </a>

      <div class="drawer-coming-soon">
        MESH LEGWEAR — COMING SOON
      </div>

    </div>

  </aside>


  <!-- HERO -->

  <section class="hero">

    <video
      class="hero-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    >
      <source
        src="hero%20vid.mov"
        type="video/quicktime"
      >

      Your browser does not support the video tag.
    </video>

    <img
      src="hero-poster.jpg"
      class="hero-poster"
      alt=""
    >

    <div class="overlay"></div>


    <!-- TOP NAV -->

    <nav class="top-nav">

      <button
        type="button"
        onclick="openCollectionDrawer()"
      >
        Shop
      </button>

      <a href="about.html">
        About
      </a>

    </nav>


    <!-- CENTER -->

    <div class="hero-content">

      <h1>
        LEG THEORY
      </h1>

      <a
        class="collection-button"
        href="#"
        onclick="openCollectionDrawer(); return false;"
      >
        View Collection
      </a>

    </div>


    <!-- BOTTOM NAV -->

    <div class="bottom-nav">

      <!-- HELP -->

      <div class="bottom-group help">

        <button
          class="bottom-toggle"
          type="button"
          onclick="toggleBottomMenu('helpMenu', event)"
        >
          Help
        </button>

        <div
          class="bottom-menu"
          id="helpMenu"
        >

          <a href="policies.html">
            Policies
          </a>

          <a href="withdraw.html">
            Withdraw / Return
          </a>

          <a href="mailto:hello@legtheory.com">
            Contact
          </a>

          <a
            href="https://www.instagram.com/thelegtheory/"
            target="_blank"
            rel="noopener noreferrer"
          >
            Instagram
          </a>

        </div>

      </div>


      <!-- INFO -->

      <div class="bottom-group info">

        <button
          class="bottom-toggle"
          type="button"
          onclick="toggleBottomMenu('infoMenu', event)"
        >
          + Info
        </button>

        <div
          class="bottom-menu"
          id="infoMenu"
        >

          <a href="terms.html">
            Terms
          </a>

          <a href="privacy.html">
            Privacy
          </a>

          <a href="terms.html">
            Business Information
          </a>

        </div>

      </div>

    </div>

  </section>


  <script>

    function openCollectionDrawer() {
      closeBottomMenus();

      document
        .getElementById('collectionDrawer')
        .classList.add('open');

      document
        .getElementById('collectionOverlay')
        .classList.add('open');

      document.body.style.overflow = 'hidden';
    }


    function closeCollectionDrawer() {

      document
        .getElementById('collectionDrawer')
        .classList.remove('open');

      document
        .getElementById('collectionOverlay')
        .classList.remove('open');

      document.body.style.overflow = '';
    }


    function toggleBottomMenu(menuId, event) {

      event.stopPropagation();

      const selectedMenu =
        document.getElementById(menuId);

      const wasOpen =
        selectedMenu.classList.contains('open');

      closeBottomMenus();

      if (!wasOpen) {
        selectedMenu.classList.add('open');
      }
    }


    function closeBottomMenus() {

      document
        .querySelectorAll('.bottom-menu')
        .forEach(menu => {
          menu.classList.remove('open');
        });
    }


    document.addEventListener('click', event => {

      if (!event.target.closest('.bottom-group')) {
        closeBottomMenus();
      }

    });


    document.addEventListener('keydown', event => {

      if (event.key === 'Escape') {
        closeBottomMenus();
        closeCollectionDrawer();
      }

    });


    const heroVideo =
      document.querySelector('.hero-video');

    const heroPoster =
      document.querySelector('.hero-poster');


    heroVideo.addEventListener('playing', () => {
      heroPoster.classList.add('hidden');
    });

  </script>

</body>

</html>
