<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leg Theory Checkout Test</title>
</head>

<body style="background:#111;color:white;font-family:Arial;padding:40px;">

  <h2>Leg Theory Checkout Test</h2>

  <p>This is only a Stripe sandbox test.</p>

 <h3>Choose product</h3>

<select id="product" style="padding:12px;margin:10px;">
  <option value="red-m">Red M</option>
  <option value="white-m">White M</option>
  <option value="white-l">White L</option>
  <option value="black-s">Black S</option>
  <option value="black-m">Black M</option>
  <option value="black-l">Black L</option>
  <option value="mesh-long">Mesh Legwear Long 95cm</option>
</select>

<h3>Choose shipping country</h3>

<button onclick="startCheckout('NL')" style="padding:15px 25px;margin:10px;">
  Netherlands
</button>

<button onclick="startCheckout('BE')" style="padding:15px 25px;margin:10px;">
  Belgium
</button>

<button onclick="startCheckout('DE')" style="padding:15px 25px;margin:10px;">
  Germany
</button>

<button onclick="startCheckout('FR')" style="padding:15px 25px;margin:10px;">
  France
</button>

  <p id="status"></p>

  <script>
    async function startCheckout(country) {
  const status = document.getElementById('status');
  const product = document.getElementById('product').value;

  status.textContent = 'Creating checkout...';

  try {
    const response = await fetch('/api/create-checkout', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        country,
        product
      })
    });

    const data = await response.json();

    if (!response.ok) {
      console.error(data);
      status.textContent = 'Something went wrong. Check the response.';
      return;
    }

    window.location.href = data.url;

  } catch (error) {
    console.error(error);
    status.textContent = 'Could not connect to checkout.';
  }
}
  </script>

</body>
</html>
